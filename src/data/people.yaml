# People — the Team page is generated from this file.
# ---------------------------------------------------
# Only Dr. Michael Kinzel (Principal Investigator) is real. Every other entry
# is an obvious development placeholder: delete them and add real members.
#
# Required
#   name               Full name as displayed
#   slug               Unique, URL-safe id (used for /team/#<slug> and references
#                      from projects / news). Never reuse a slug.
#   role               pi | postdoc | phd | ms | bs | alumni
# Optional
#   honorific          e.g. "Dr." (shown before the name)
#   degreeStatus       line under the name; defaults to the role label
#   title              secondary title, e.g. academic rank
#   portrait           relative to src/assets/images/ (e.g. team/jane-doe.webp,
#                      optimised) or a /public path (e.g. /images/team/jane-doe.webp).
#                      Any aspect ratio works; cards crop to 4:5.
#   portraitAlt        defaults to "Portrait of <name>"
#   researchInterests  list of short phrases
#   googleScholar      full Google Scholar profile URL
#   profileUrl         institutional profile page URL
#   website, email, bio, links[{label, url}]
#   graduationYear, currentPosition   (alumni)
#   order              sort order within the role (lower first)
#   placeholder        true shows a "Demo content" badge
#
# Sections with no people are hidden automatically (e.g. Alumni).

